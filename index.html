<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROTA GB - Super App de Bissau</title>
    
    <meta name="theme-color" content="#00e676">
    <link rel="manifest" href="manifest.json">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #333; padding: 10px; }
        
        .app-container {
            width: 410px;
            height: 840px;
            max-height: 95vh;
            background: #f8f9fa;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border-radius: 36px;
            border: 12px solid #222;
            overflow-y: auto;
            overflow-x: hidden;
            position: relative;
            padding-top: 35px;
            box-sizing: border-box;
        }

        .services-section { padding: 12px 15px; margin-bottom: 2px; }
        .services-section h3 { color: #1a1a1a; font-size: 15px; margin-bottom: 8px; font-weight: 600; }
        .services-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

        .service-card {
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
            color: #24292e;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.04);
            user-select: none;
        }

        .service-card:hover { background: #f1f8ff; border-color: #00e676; transform: translateY(-2px); }
        .service-card.selected { border-color: #00e676; background: rgba(0,230,118,0.08); }
        .service-card .icon { font-size: 20px; margin-bottom: 4px; }
        .service-card .badge { position: absolute; top: -6px; right: -6px; background: #f85149; color: white; font-size: 8px; padding: 2px 5px; border-radius: 6px; font-weight: bold; }
        
        .header { background: #1a1a1a; color: #fff; padding: 14px 16px; position: relative; z-index: 20; }
        .logo { font-size: 18px; font-weight: bold; color: #00e676; display: flex; align-items: center; gap: 6px; }
        .badge-gb { background: #ce1126; color: #fcd116; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .role-switch { background: #333; padding: 3px; border-radius: 20px; display: flex; }
        .role-btn { border: none; background: transparent; color: #aaa; padding: 5px 12px; border-radius: 14px; font-size: 11px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .role-btn.active { background: #00e676; color: #000; }

        .map-area { height: 140px; background: #e5e3df; position: relative; overflow: hidden; z-index: 1; }
        canvas#bissauMap { width: 100%; height: 100%; display: block; }
        .status-pill { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.75); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 11px; display: flex; align-items: center; gap: 6px; backdrop-filter: blur(4px); z-index: 5; }
        .dot-green { width: 8px; height: 8px; background: #00e676; border-radius: 50%; }

        .bottom-panel { background: #fff; padding: 14px; display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 20; }
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 11px; color: #666; font-weight: bold; }
        select, input { padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; outline: none; background: #f9f9f9; width: 100%; cursor: pointer; }

        .service-options { display: flex; gap: 6px; }
        .service-title { font-size: 10px; font-weight: bold; }
        .service-price { font-size: 11px; font-weight: 800; color: #1a1a1a; margin-top: 2px; }

        .sub-section-title { font-size: 14px; font-weight: bold; color: #1a1a1a; margin: 12px 0 8px 0; }
        .btn-primary { background: #00e676; color: #000; border: none; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-align: center; width: 100%; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div class="logo">ROTA GB <span class="badge-gb">GW</span></div>
            <div class="role-switch">
                <button type="button" class="role-btn active" id="btn-passageiro" onclick="setRole('passageiro')">Cliente</button>
                <button type="button" class="role-btn" id="btn-motorista" onclick="setRole('motorista')">Motorista</button>
            </div>
        </div>
    </div>

    <div id="clienteSections">
        <div class="services-section">
            <h3>Go anywhere</h3>
            <div class="services-grid">
                <div class="service-card" onclick="abrirModalVoos()">
                    <span class="icon">✈️</span>
                    <span>Voos</span>
                </div>
            </div>
        </div>

        <div class="services-section">
            <h3>Alojamento & Estadias</h3>
            <div class="services-grid">
                <div class="service-card" onclick="abrirModalHoteis()">
                    <span class="icon">🏨</span>
                    <span>Hotéis</span>
                </div>
                <div class="service-card" onclick="abrirModalAirbnb()">
                    <span class="badge">Novo</span>
                    <span class="icon">🏡</span>
                    <span>Airbnb</span>
                </div>
            </div>
        </div>
    </div>

    <div class="map-area">
        <div class="status-pill"><div class="dot-green"></div> GPS Bissau Ativo</div>
        <canvas id="bissauMap"></canvas>
    </div>

    <div class="bottom-panel" id="panel-cliente">
        <button type="button" onclick="abrirModalVoos()" class="btn-primary">Ver Voos e Bilhetes (Ida e Volta)</button>
    </div>
</div>

<!-- Modal Interativo (Hotéis, Airbnb e Voos com Imagem, Datas e Preços) -->
<div id="mediaModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center; padding:15px; box-sizing:border-box;">
    <div style="background:#ffffff; width:100%; max-width:350px; padding:16px; border-radius:16px; text-align:center; box-sizing:border-box; margin:auto;">
        <h3 id="mediaModalTitle" style="color:#111; margin-bottom:8px; font-size:16px;">Título</h3>
        
        <div id="mediaContainer" style="margin-bottom:10px;">
            <img id="mediaImage" src="" alt="Imagem" style="width:100%; height:150px; border-radius:10px; object-fit:cover; margin-bottom:6px;">
            <div id="mediaCaption" style="font-size:11px; font-weight:bold; color:#111; margin-bottom:2px;">Legenda</div>
            <div id="mediaPhone" style="font-size:11px; color:#00b0ff; font-weight:bold; margin-bottom:6px;">Contacto</div>
            
            <div style="display:flex; gap:6px; justify-content:center; margin-bottom:8px;">
                <button type="button" onclick="mudarMediaItem(-1)" style="background:#333; color:#fff; border:none; padding:5px 10px; border-radius:6px; font-size:10px; cursor:pointer;">◀ Anterior</button>
                <button type="button" onclick="mudarMediaItem(1)" style="background:#333; color:#fff; border:none; padding:5px 10px; border-radius:6px; font-size:10px; cursor:pointer;">Seguinte ▶</button>
            </div>
        </div>

        <!-- Campos específicos para Voos (Ida e Volta / Datas) -->
        <div id="voosExtraFields" style="display:none; text-align:left; margin-bottom:8px;">
            <label style="font-size:10px; font-weight:bold; color:#444;">Tipo de Viagem:</label>
            <select id="tipoViagemSelect" style="width:100%; padding:6px; border:1px solid #ddd; border-radius:6px; font-size:11px; margin-bottom:6px;">
                <option value="Ida e Volta">Ida e Volta</option>
                <option value="Apenas Ida">Apenas Ida</option>
            </select>
            <div style="display:flex; gap:6px;">
                <div style="flex:1;">
                    <label style="font-size:9px; color:#666;">Data Ida:</label>
                    <input type="date" id="dataIda" style="width:100%; padding:6px; font-size:10px;">
                </div>
                <div style="flex:1;">
                    <label style="font-size:9px; color:#666;">Data Volta:</label>
                    <input type="date" id="dataVolta" style="width:100%; padding:6px; font-size:10px;">
                </div>
            </div>
        </div>

        <input type="text" id="mediaInput" placeholder="Escreva o destino ou detalhe..." style="width:100%; padding:8px; border:1px solid #ddd; border-radius:6px; margin-bottom:8px; font-size:12px; box-sizing:border-box;">

        <div style="margin-bottom:10px; text-align:left;">
            <label style="font-size:11px; font-weight:bold; color:#333; display:block; margin-bottom:2px;">Método de Pagamento:</label>
            <select id="mediaPayment" style="width:100%; padding:6px; border:1px solid #ddd; border-radius:6px; font-size:12px;">
                <option value="Mobile Money (Orange/MTN)">Mobile Money (Orange / MTN)</option>
                <option value="Dinheiro (Cash)">Dinheiro (Cash)</option>
            </select>
        </div>
        
        <button onclick="confirmarMediaModal()" style="width:100%; background:#00e676; color:#000; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; margin-bottom:6px; font-size:13px;">Confirmar Reserva</button>
        <button onclick="fecharMediaModal()" style="width:100%; background:#f1f1f1; color:#333; border:none; padding:8px; border-radius:6px; cursor:pointer; font-size:12px;">Cancelar</button>
    </div>
</div>

<script>
    let currentModalType = '';
    let currentIndex = 0;

    const hoteisData = [
        { img: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400", text: "Hotel Ledger Plaza — 85.000 XOF/noite", phone: "Receção Ledger: +245 966 789 012" },
        { img: "https://images.unsplash.com/photo-1582719508461-905c673771fd?w=400", text: "Azalai Hotel 24 de Setembro — 65.000 XOF/noite", phone: "Receção Azalai: +245 955 000 111" }
    ];

    const airbnbData = [
        { img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=400", text: "Vivenda c/ Quintal (Bandim) — 50.000 XOF/noite", phone: "Anfitrião: +245 966 112 233" }
    ];

    const voosData = [
        { img: "https://images.unsplash.com/photo-1436491865332-7a61a109cc05?w=400", text: "TAP Air Portugal (Bissau -> Lisboa) — 350.000 XOF (Ida) / 550.000 XOF (Ida/Volta)", phone: "Guichê Osvaldo Vieira: +245 955 100 200" },
        { img: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=400", text: "Air Senegal (Bissau -> Dakar) — 120.000 XOF (Ida) / 210.000 XOF (Ida/Volta)", phone: "Balcão Aeroporto: +245 966 200 300" }
    ];

    function abrirModalHoteis() {
        currentModalType = 'hoteis';
        currentIndex = 0;
        document.getElementById('mediaModalTitle').innerText = "Hotéis em Bissau";
        document.getElementById('voosExtraFields').style.display = 'none';
        atualizarModalMedia();
        document.getElementById('mediaModal').style.display = 'flex';
    }

    function abrirModalAirbnb() {
        currentModalType = 'airbnb';
        currentIndex = 0;
        document.getElementById('mediaModalTitle').innerText = "Airbnb e Apartamentos";
        document.getElementById('voosExtraFields').style.display = 'none';
        atualizarModalMedia();
        document.getElementById('mediaModal').style.display = 'flex';
    }

    function abrirModalVoos() {
        currentModalType = 'voos';
        currentIndex = 0;
        document.getElementById('mediaModalTitle').innerText = "Voos e Bilhetes (Aeroporto Osvaldo Vieira)";
        document.getElementById('voosExtraFields').style.display = 'block';
        atualizarModalMedia();
        document.getElementById('mediaModal').style.display = 'flex';
    }

    function atualizarModalMedia() {
        let dataset = hoteisData;
        if (currentModalType === 'airbnb') dataset = airbnbData;
        if (currentModalType === 'voos') dataset = voosData;

        let item = dataset[currentIndex];
        document.getElementById('mediaImage').src = item.img;
        document.getElementById('mediaCaption').innerText = item.text;
        document.getElementById('mediaPhone').innerText = item.phone;
    }

    function mudarMediaItem(direcao) {
        let dataset = hoteisData;
        if (currentModalType === 'airbnb') dataset = airbnbData;
        if (currentModalType === 'voos') dataset = voosData;

        currentIndex += direcao;
        if (currentIndex < 0) currentIndex = dataset.length - 1;
        if (currentIndex >= dataset.length) currentIndex = 0;
        atualizarModalMedia();
    }

    function fecharMediaModal() {
        document.getElementById('mediaModal').style.display = 'none';
    }

    function confirmarMediaModal() {
        alert("Reserva efetuada com sucesso na ROTA GB, Bissau! 🚀");
        fecharMediaModal();
    }
</script>
</body>
</html>
