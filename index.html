<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROTA GB - Bissau</title>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            pointer-events: auto !important; /* Garante que todos os elementos aceitam cliques */
        }

        body {
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        /* Barra Superior */
        .top-bar {
            background-color: #121212;
            padding: 16px 18px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.2rem;
            color: #00e676;
        }

        .badge-gw {
            background-color: #d32f2f;
            color: white;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .user-toggle {
            background-color: #262626;
            padding: 3px;
            border-radius: 20px;
            display: flex;
        }

        .toggle-btn {
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            color: #aaa;
            background: transparent;
        }

        .toggle-btn.active {
            background-color: #00e676;
            color: #121212;
        }

        /* Menu de Serviços */
        .services-menu {
            background-color: #1c1c1c;
            padding: 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .service-item {
            background: #2a2a2a;
            color: #ccc;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .service-item.active {
            background: #00e676;
            color: #121212;
        }

        /* Área do Mapa Visual */
        .map-preview {
            height: 110px;
            background-color: #e5e3df;
            background-image: radial-gradient(#ccc 1px, transparent 0);
            background-size: 12px 12px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gps-badge {
            background: rgba(18, 18, 18, 0.85);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot-green {
            width: 8px;
            height: 8px;
            background-color: #00e676;
            border-radius: 50%;
        }

        /* Form Seção */
        .form-section {
            padding: 18px;
        }

        .section-title {
            font-size: 0.72rem;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 0.88rem;
            background-color: #f9f9f9;
            margin-bottom: 12px;
            outline: none;
            cursor: pointer;
        }

        /* Categoria de Veículos */
        .vehicles-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .vehicle-card {
            border: 2px solid #eee;
            border-radius: 10px;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            user-select: none;
        }

        .vehicle-card.selected {
            border-color: #00e676;
            background-color: #e8fef0;
        }

        .vehicle-name {
            font-size: 0.7rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 4px;
        }

        .vehicle-price {
            font-size: 0.8rem;
            font-weight: 800;
            color: #121212;
        }

        .btn-pedir {
            width: 100%;
            background-color: #00e676;
            color: #121212;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0,230,118,0.3);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="top-bar">
            <div class="brand">
                ROTA GB <span class="badge-gw">GW</span>
            </div>
            <div class="user-toggle">
                <button class="toggle-btn active" onclick="setRole('cliente', this)">Cliente</button>
                <button class="toggle-btn" onclick="setRole('motorista', this)">Motorista</button>
            </div>
        </div>

        <div class="services-menu">
            <button class="service-item active" onclick="selectService(this)">🚗 Transporte</button>
            <button class="service-item" onclick="selectService(this)">🍲 Comida</button>
            <button class="service-item" onclick="selectService(this)">🛍️ Lojas</button>
            <button class="service-item" onclick="selectService(this)">🏨 Hotéis & Apts</button>
            <button class="service-item" onclick="selectService(this)">📱 Recargas</button>
        </div>

        <div class="map-preview">
            <div class="gps-badge">
                <span class="dot-green"></span> GPS Bissau Ativo
            </div>
        </div>

        <div class="form-section">
            <div class="section-title">ROTA OFICIAL DGVTT - BISSAU (CORRIDA EXCLUSIVA)</div>
            <select id="rota-select">
                <option value="Cidade → Bairro Militar Somec (475 XOF)">Cidade → Bairro Militar Somec (475 XOF)</option>
                <option value="Cidade → Bandim (400 XOF)">Cidade → Bandim (400 XOF)</option>
                <option value="Cidade → Antula (500 XOF)">Cidade → Antula (500 XOF)</option>
            </select>

            <input type="text" id="ponto-referencia" placeholder="Ponto de Referência (Ex: Perto do Mercado, portão verde)">

            <div class="vehicles-grid">
                <div class="vehicle-card selected" onclick="selecionarVeiculo(this, '950 XOF')">
                    <div class="vehicle-name">🚖 Táxi Oficial</div>
                    <div class="vehicle-price">950 XOF</div>
                </div>
                <div class="vehicle-card" onclick="selecionarVeiculo(this, '1235 XOF')">
                    <div class="vehicle-name">🚘 Carro Privado</div>
                    <div class="vehicle-price">1235 XOF</div>
                </div>
                <div class="vehicle-card" onclick="selecionarVeiculo(this, '665 XOF')">
                    <div class="vehicle-name">🛵 Moto-Táxi</div>
                    <div class="vehicle-price">665 XOF</div>
                </div>
            </div>

            <div class="section-title">FORMA DE PAGAMENTO DA VIAGEM</div>
            <select id="pagamento-select">
                <option value="Dinheiro Vivo">💵 Dinheiro Vivo (Ao Condutor)</option>
                <option value="Orange Money">🟧 Orange Money</option>
                <option value="Telecel Cash">🟦 Telecel Cash</option>
            </select>

            <button class="btn-pedir" onclick="pedirViagem()">Pedir Viagem Agora</button>
        </div>
    </div>

    <script>
        // Configuração segura do Supabase (Ajuste com as suas chaves)
        const SUPABASE_URL = "https://ymuldaviwfbcvocfknaw.supabase.co";
        const SUPABASE_ANON_KEY = "SUA_CHAVE_ANONIMA_AQUI";
        
        let supabaseClient = null;
        if (typeof supabase !== 'undefined' && SUPABASE_ANON_KEY !== "SUA_CHAVE_ANONIMA_AQUI") {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        let precoSelecionado = "950 XOF";

        function selecionarVeiculo(elemento, preco) {
            document.querySelectorAll('.vehicle-card').forEach(card => card.classList.remove('selected'));
            elemento.classList.add('selected');
            precoSelecionado = preco;
        }

        function selectService(elemento) {
            document.querySelectorAll('.service-item').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
        }

        function setRole(role, elemento) {
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
        }

        async function pedirViagem() {
            const rota = document.getElementById('rota-select').value;
            const pontoRef = document.getElementById('ponto-referencia').value;
            const pagamento = document.getElementById('pagamento-select').value;

            if (!pontoRef) {
                alert("Por favor, preencha o Ponto de Referência em Bissau!");
                return;
            }

            if (supabaseClient) {
                await supabaseClient.from('viagens').insert([
                    { destino: rota, ponto_referencia: pontoRef, status: 'pendente' }
                ]);
            }

            alert("🚀 Pedido enviado com sucesso!\n\nRota: " + rota + "\nPreço: " + precoSelecionado + "\nPagamento: " + pagamento);
        }
    </script>
</body>
</html>
