<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROTA GB - Registo de Motoristas</title>

    <!-- 1. Bibliotecas Obrigatórias -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        h2, h3 { color: #1a1a1a; text-align: center; margin-bottom: 10px; }
        input, select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; width: 100%; box-sizing: border-box; }
        button { background-color: #00e676; color: #1a1a1a; font-weight: bold; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 5px; }
        button:hover { background-color: #00c853; }
        canvas { border: 1px solid #ccc; background: #fafafa; border-radius: 5px; width: 100%; touch-action: none; }
    </style>
</head>
<body>

    <!-- 1. Formulário de Cadastro do Motorista -->
    <div class="container" id="formCadastroMotorista">
        <h2>ROTA GB — Bissau</h2>
        <p style="font-size: 13px; color: #666; text-align: center;">Registo Oficial de Condutores</p>
        
        <input type="text" id="nomeMotorista" placeholder="Nome Completo" required>
        <input type="email" id="emailMotorista" placeholder="E-mail" required>
        <input type="text" id="telefoneMotorista" placeholder="Telefone (ex: 9xxxxxxx)" required>
        
        <select id="tipoTransporte">
            <option value="Táxi Azul/Amarelo">Táxi Azul/Amarelo</option>
            <option value="Moto-Táxi">Moto-Táxi</option>
            <option value="Carro Privado">Carro Privado</option>
        </select>

        <input type="text" id="marcaModelo" placeholder="Marca e Modelo do Veículo" required>
        <input type="text" id="matriculaVeiculo" placeholder="Número de Matrícula (Placa)" required>
        
        <select id="metodoRecebimentoMotorista">
            <option value="MTN Money">MTN Money</option>
            <option value="Orange Money">Orange Money</option>
            <option value="Banco">Transferência Bancária</option>
        </select>

        <input type="text" id="numeroContaMotorista" placeholder="Número da Carteira / Conta" required>
        
        <button type="button" onclick="avancarParaContrato()">Prosseguir para o Contrato</button>
    </div>

    <!-- 2. Secção do Contrato e Assinatura Digital -->
    <div class="container" id="contractStep" style="display: none;">
        <h3>📜 Contrato de Parceria</h3>
        <p style="font-size: 12px; color: #444;">Ao submeter, aceita a comissão de 15% e as normas operacionais do ROTA GB em Bissau.</p>
        
        <label style="font-size: 13px; font-weight: bold;">Desenhe a sua assinatura abaixo:</label>
        <canvas id="sigCanvas" width="350" height="150"></canvas>
        
        <button type="button" style="background-color: #ff5252; color: white; padding: 8px;" onclick="limparAssinatura()">Limpar Assinatura</button>
        
        <button type="button" onclick="finalizarEGerarPDF()">Assinar & Submeter Registo</button>
    </div>

    <script>
        // ==========================================
        // LIGAR AO SEU SUPABASE (CONFIGURADO)
        // ==========================================
        const SUPABASE_URL = 'https://ymuldaviwfbcvocfknaw.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InltdWxkYXZpd2ZiY3ZvY2ZrbmF3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDA4NDcsImV4cCI6MjEwNjcxNjg0N30.uBSZQ_YChvWUS7B7TE762qGRSBaajFf-Flh18J7E0BU';

        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let sigCanvas, sigCtx, hasSigned = false;

        window.onload = function() {
            sigCanvas = document.getElementById('sigCanvas');
            sigCtx = sigCanvas.getContext('2d');
            
            let painting = false;
            sigCanvas.addEventListener('mousedown', startPos);
            sigCanvas.addEventListener('mouseup', endPos);
            sigCanvas.addEventListener('mousemove', draw);
            sigCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); startPos(e.touches[0]); });
            sigCanvas.addEventListener('touchend', (e) => { e.preventDefault(); endPos(); });
            sigCanvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e.touches[0]); });

            function startPos(e) { painting = true; draw(e); }
            function endPos() { painting = false; sigCtx.beginPath(); hasSigned = true; }
            function draw(e) {
                if(!painting) return;
                const rect = sigCanvas.getBoundingClientRect();
                sigCtx.lineWidth = 2;
                sigCtx.lineCap = 'round';
                sigCtx.strokeStyle = '#000';
                sigCtx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
                sigCtx.stroke();
                sigCtx.beginPath();
                sigCtx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
            }
        };

        function limparAssinatura() {
            sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);
            hasSigned = false;
        }

        function avancarParaContrato() {
            const nome = document.getElementById('nomeMotorista').value;
            const email = document.getElementById('emailMotorista').value;
            const telefone = document.getElementById('telefoneMotorista').value;
            const matricula = document.getElementById('matriculaVeiculo').value;

            if(!nome || !email || !telefone || !matricula) {
                alert("Por favor, preencha todos os campos obrigatórios antes de prosseguir.");
                return;
            }
            document.getElementById('formCadastroMotorista').style.display = 'none';
            document.getElementById('contractStep').style.display = 'flex';
        }

        // ==========================================
        // SUBMIT, SUPABASE, PDF E AUTOCOLANTE
        // ==========================================
        async function finalizarEGerarPDF() {
            if(!hasSigned) {
                alert("Por favor, desenhe a sua assinatura no quadro antes de concluir.");
                return;
            }

            const nome = document.getElementById('nomeMotorista').value;
            const email = document.getElementById('emailMotorista').value;
            const tel = document.getElementById('telefoneMotorista').value;
            const tipoTransp = document.getElementById('tipoTransporte').value;
            const veiculo = document.getElementById('marcaModelo').value;
            const matricula = document.getElementById('matriculaVeiculo').value;
            const metodo = document.getElementById('metodoRecebimentoMotorista').value;
            const conta = document.getElementById('numeroContaMotorista').value;
            const dataAtual = new Date().toLocaleDateString('pt-PT');

            // 1. Enviar para o Supabase (fica pendente para aprovação na tabela 'motoristas')
            const { data, error } = await _supabase
                .from('motoristas')
                .insert([
                    { 
                        nome: nome, 
                        email: email, 
                        telefone: tel, 
                        tipo_transporte: tipoTransp,
                        marca_modelo: veiculo,
                        placa_veiculo: matricula,
                        metodo_recebimento: metodo,
                        conta_recebimento: conta,
                        status: 'pendente' 
                    }
                ]);

            if (error) {
                alert("Erro ao gravar no Supabase: " + error.message);
                return;
            }

            // 2. Gerar o Contrato PDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFillColor(26, 26, 26);
            doc.rect(0, 0, 210, 30, 'F');
            doc.setTextColor(0, 230, 118);
            doc.setFontSize(22);
            doc.setFont("helvetica", "bold");
            doc.text("ROTA GB — Guiné-Bissau", 15, 20);

            doc.setTextColor(255, 255, 255);
            doc.setFontSize(10);
            doc.text("Contrato Oficial de Parceria & Prestação de Serviços", 115, 20);

            doc.setTextColor(0, 0, 0);
            doc.setFontSize(11);
            doc.text(`Data de Emissão: ${dataAtual}`, 15, 42);

            doc.setFontSize(13);
            doc.setFont("helvetica", "bold");
            doc.text("1. DADOS DO PARCEIRO / CONDUTOR", 15, 52);
            doc.setFontSize(10);
            doc.setFont("helvetica", "normal");
            doc.text(`Nome Completo: ${nome}`, 15, 60);
            doc.text(`E-mail: ${email}`, 15, 66);
            doc.text(`Telefone: +245 ${tel}`, 15, 72);
            doc.text(`Veículo: ${veiculo} | Matrícula: ${matricula}`, 15, 78);
            doc.text(`Recebimento: ${metodo} (${conta})`, 15, 84);

            doc.setFont("helvetica", "bold");
            doc.setFontSize(13);
            doc.text("2. CLÁUSULAS CONTRATUAIS", 15, 96);
            doc.setFontSize(9);
            doc.setFont("helvetica", "normal");
            doc.text("• Comissão ROTA GB: Taxa de 15% sobre o valor de cada viagem/serviço em Bissau.", 15, 104);
            doc.text("• Repartição Automática: 85% do valor cobrado é de direito do condutor.", 15, 110);

            doc.setFont("helvetica", "bold");
            doc.setFontSize(13);
            doc.text("3. ASSINATURAS", 15, 132);

            doc.setFontSize(10);
            doc.text("Pela Plataforma ROTA GB:", 15, 142);
            doc.setDrawColor(0, 230, 118);
            doc.setLineWidth(1);
            doc.rect(15, 146, 75, 30);
            
            doc.setTextColor(20, 40, 120);
            doc.setFont("times", "bolditalic");
            doc.setFontSize(15);
            doc.text("Lavi Duarte Indeque", 20, 159); 

            doc.setTextColor(0, 0, 0);
            doc.setFont("helvetica", "bold");
            doc.setFontSize(8);
            doc.text("Direção Executiva — ROTA GB", 20, 168);

            doc.text("Pelo Condutor / Parceiro:", 115, 142);
            const sigImgData = sigCanvas.toDataURL('image/png');
            doc.addImage(sigImgData, 'PNG', 115, 146, 75, 30);
            doc.setFontSize(8);
            doc.setFont("helvetica", "normal");
            doc.text(`Nome: ${nome}`, 115, 180);

            doc.save(`Contrato_ROTA_GB_${nome.replace(/\s+/g, '_')}.pdf`);

            // 3. Gerar Imagem do Autocolante de Porta Personalizado
            const badgeCanvas = document.createElement('canvas');
            badgeCanvas.width = 600;
            badgeCanvas.height = 300;
            const bCtx = badgeCanvas.getContext('2d');

            bCtx.fillStyle = "#ffffff";
            bCtx.fillRect(0, 0, 600, 300);
            bCtx.strokeStyle = "#1a1a1a";
            bCtx.lineWidth = 10;
            bCtx.strokeRect(5, 5, 590, 290);

            bCtx.fillStyle = "#1a1a1a";
            bCtx.fillRect(15, 15, 570, 70);
            bCtx.fillStyle = "#00e676";
            bCtx.font = "bold 32px sans-serif";
            bCtx.fillText("ROTA GB", 35, 60);

            bCtx.fillStyle = "#ffffff";
            bCtx.font = "14px sans-serif";
            bCtx.fillText("PARCEIRO OFICIAL EM BISSAU", 230, 52);

            bCtx.fillStyle = "#1a1a1a";
            bCtx.font = "bold 28px sans-serif";
            bCtx.fillText("EXPRESS & TRANSPORTES", 35, 130);

            bCtx.fillStyle = "#666666";
            bCtx.font = "bold 16px sans-serif";
            bCtx.fillText("CONDUTOR AUTORIZADO", 35, 165);
            bCtx.fillStyle = "#1a1a1a";
            bCtx.font = "bold 20px sans-serif";
            bCtx.fillText(nome.toUpperCase(), 35, 192);

            bCtx.fillStyle = "#fcd116"; 
            bCtx.fillRect(35, 215, 530, 55);
            bCtx.strokeStyle = "#1a1a1a";
            bCtx.lineWidth = 3;
            bCtx.strokeRect(35, 215, 530, 55);

            bCtx.fillStyle = "#1a1a1a";
            bCtx.font = "bold 26px monospace";
            bCtx.fillText(`MATRÍCULA: ${matricula.toUpperCase()}`, 65, 252);

            const link = document.createElement('a');
            link.download = `Autocolante_Porta_${matricula.replace(/\s+/g, '_')}.png`;
            link.href = badgeCanvas.toDataURL('image/png');
            link.click();

            alert(`🎉 Sucesso absoluto!\n\n• Registo enviado para o Supabase (Estado: Pendente).\n• Contrato PDF descarregado.\n• Autocolante de porta (${matricula}) gerado para a gráfica.`);

            location.reload();
        }
    </script>
</body>
</html>
