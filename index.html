<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROTA GB - Mobilidade Urbana de Bissau</title>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background-color: #008751; /* Verde Oficial ROTA GB */
            color: #ffffff;
            padding: 24px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 4px;
        }

        .content {
            padding: 24px 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #333333;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #222222;
            background-color: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #008751;
            background-color: #ffffff;
        }

        .status-gps {
            font-size: 0.75rem;
            color: #28a745;
            margin-top: 5px;
            font-weight: 500;
        }

        .btn-pedir {
            width: 100%;
            background-color: #008751;
            color: #ffffff;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s ease;
        }

        .btn-pedir:hover {
            background-color: #006b3f;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>🇬🇼 ROTA GB</h1>
            <p>Mobilidade Urbana em Bissau</p>
        </div>

        <div class="content">
            <div class="form-group">
                <label>📍 Local de Recolha (GPS):</label>
                <input type="text" id="origem-gps" value="A detetar localização..." readonly>
                <div class="status-gps" id="status-texto">● A ligar ao GPS...</div>
            </div>

            <div class="form-group">
                <label>🏠 Ponto de Referência (Bissau):</label>
                <input type="text" id="ponto-referencia" placeholder="Ex: Perto do Mercado de Bandim, portão verde">
            </div>

            <div class="form-group">
                <label>🏁 Destino:</label>
                <input type="text" id="destino" placeholder="Para onde vai? (Ex: Praça dos Heróis)">
            </div>

            <button class="btn-pedir" onclick="pedirCorrida()">Pedir ROTA GB</button>
        </div>
    </div>

    <script>
        // Substitua pelas suas credenciais do Supabase
        const SUPABASE_URL = "https://SUA_URL.supabase.co";
        const SUPABASE_ANON_KEY = "SUA_CHAVE_ANONIMA";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let latAtual = 11.8632;
        let lngAtual = -15.5843;

        // Obter GPS em tempo real
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    latAtual = pos.coords.latitude;
                    lngAtual = pos.coords.longitude;
                    document.getElementById('origem-gps').value = `GPS: ${latAtual.toFixed(5)}, ${lngAtual.toFixed(5)}`;
                    document.getElementById('status-texto').innerText = "● Localização obtida com precisão";
                },
                (err) => {
                    document.getElementById('origem-gps').value = "Bissau (Centro)";
                    document.getElementById('status-texto').innerText = "● Usando localização padrão de Bissau";
                },
                { enableHighAccuracy: true }
            );
        }

        async function pedirCorrida() {
            const pontoRef = document.getElementById('ponto-referencia').value;
            const destino = document.getElementById('destino').value;

            if (!pontoRef) {
                alert("Por favor, insira um ponto de referência em Bissau.");
                return;
            }
            if (!destino) {
                alert("Por favor, insira o seu destino.");
                return;
            }

            const { data, error } = await supabase
                .from('viagens')
                .insert([
                    {
                        latitude_origem: latAtual,
                        longitude_origem: lngAtual,
                        ponto_referencia: pontoRef,
                        destino: destino,
                        status: 'pendente'
                    }
                ]);

            if (error) {
                alert("Erro ao pedir corrida. Verifique a ligação.");
            } else {
                alert("🚀 Corrida solicitada com sucesso!");
            }
        }
    </script>

</body>
</html>
